services:

  postgres:
    image: postgres:17
    container_name: aipaysec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipaysec
      POSTGRES_USER: aipaysec
      POSTGRES_PASSWORD: aipaysec_dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aipaysec-network

  mongodb:
    image: mongo:8
    container_name: aipaysec-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: aipaysec
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - aipaysec-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: aipaysec-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aipaysec-network

volumes:
  postgres_data:
  mongodb_data:
  kafka_data:

networks:
  aipaysec-network:
    driver: bridge
